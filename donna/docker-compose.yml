services:
  # Self-hosted Telegram Bot API server
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: "${TELEGRAM_API_ID}"
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH}"
      TELEGRAM_LOCAL: "1"  # local mode: 2GB uploads, HTTP webhooks, local file paths
    volumes:
      - telegram-data:/var/lib/telegram-bot-api
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Donna — Telegram ↔ Claude Code bridge
  donna:
    build: .
    restart: unless-stopped
    depends_on:
      telegram-bot-api:
        condition: service_healthy
    environment:
      DONNA_BOT_TOKEN: "${DONNA_BOT_TOKEN}"
      DONNA_WORKDIR: "/app"
      DONNA_PROMPT: "${DONNA_PROMPT:-default}"
      DONNA_AUTOPOLL: "${DONNA_AUTOPOLL:-0}"
      # Point at self-hosted Telegram Bot API
      TELEGRAM_BASE_URL: "http://telegram-bot-api:8081/bot"
      TELEGRAM_BASE_FILE_URL: "http://telegram-bot-api:8081/file/bot"
      TELEGRAM_LOCAL_MODE: "1"
      # Claude CLI config
      CLAUDE_BIN: "claude"
      CLAUDE_ARGS: "--dangerously-skip-permissions"
      # Voice (optional)
      ELEVENLABS_API_KEY: "${ELEVENLABS_API_KEY:-}"
      ELEVENLABS_VOICE_ID: "${ELEVENLABS_VOICE_ID:-JBFqnCBsd6RMkjVDRZzb}"
      FFMPEG_BIN: "/usr/bin/ffmpeg"
    volumes:
      - donna-workspace:/app/workspace

volumes:
  telegram-data:
  donna-workspace:
